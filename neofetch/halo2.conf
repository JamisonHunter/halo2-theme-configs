
# Halo 2 main menu colors for neofetch
# The numbers are terminal palette slots, so the real colors come from the
# Halo 2 terminal theme (Ghostty, Tilix or GNOME Terminal):
# 15 = bright text, 12 = accent blue, 8 = dim navy, 7 = text, 4 = steel blue
colors=(15 12 8 12 8 7)
ascii_colors=(12 4 15 12 4 7)
